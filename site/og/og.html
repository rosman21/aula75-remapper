<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;background:#0b0b0e;color:#f5f5f7;position:relative}
.glow{position:absolute;inset:-200px -100px auto auto;width:900px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(59,130,246,.35),rgba(139,92,246,.18),transparent);filter:blur(10px)}
.left{position:absolute;left:72px;top:56px;width:540px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:700;letter-spacing:-.02em}
.logo{width:60px;height:60px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#8b5cf6);display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;letter-spacing:-.5px}
h1{font-size:62px;line-height:1.04;letter-spacing:-.04em;font-weight:800}
.hl{background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:24px;line-height:1.35;color:#a1a1aa}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:17px;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(59,130,246,.15);color:#93b4ff}
.shot{position:absolute;left:660px;top:96px;width:760px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#000}
.bar{height:30px;background:#1c1c21;display:flex;gap:8px;align-items:center;padding:0 12px}
.bar i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.shot img{display:block;width:100%}
.foot{position:absolute;left:72px;bottom:34px;font-size:17px;color:#71717a}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><div class="logo">R75</div>Remap75</div>
  <h1>Remap your AULA&nbsp;75 with <span class="hl">Remap75</span></h1>
  <p>Keys, shortcuts, macros and lighting — on your Mac or right in Chrome.</p>
  <div class="pills"><span class="pill">Free &amp; open source</span><span class="pill">Mac app</span><span class="pill">Web app</span></div>
</div>
<div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../public/img/keys-dark.png"></div>
<div class="foot">remap75.app · independent, not affiliated with AULA</div>
</body></html>
